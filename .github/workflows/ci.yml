name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package universal app
        run: ./scripts/build-app.sh
      - name: Build DMG
        run: ./scripts/make-dmg.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: PortKill-dmg
          path: dist/*.dmg
          retention-days: 14
