<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="terminalClip">
      <rect x="96" y="96" width="320" height="320" rx="64" ry="64" />
    </clipPath>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="512" height="512" rx="112" ry="112" fill="#242e3d" />

  <!-- Terminal Window Outer Outline -->
  <rect x="108" y="108" width="296" height="296" rx="60" ry="60" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" />

  <!-- Terminal Prompt: >_ -->
  <!-- Chevron > -->
  <path d="M 168 162 L 208 190 L 168 218" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Cursor _ -->
  <line x1="228" y1="218" x2="270" y2="218" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />

  <!-- Flame Silhouette in Bottom-Right Corner -->
  <path d="M 346 230
           C 346 250 330 268 322 284
           C 314 300 312 312 312 328
           C 300 310 300 286 312 266
           C 302 278 288 300 288 322
           C 288 368 324 402 368 402
           C 412 402 444 366 444 322
           C 444 286 422 264 410 248
           C 416 266 414 284 404 300
           C 394 278 376 252 346 230 Z"
        fill="#ffffff" />
  
  <!-- Subtle cutout behind flame so terminal stroke doesn't clash -->
  <path d="M 346 280
           C 346 295 338 310 338 326
           C 338 350 354 368 372 368
           C 390 368 398 350 398 332
           C 398 316 388 302 376 286
           C 382 300 380 312 372 322
           C 366 310 356 296 346 280 Z"
        fill="#242e3d" />
</svg>
